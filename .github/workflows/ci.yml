# Frontend (Flutter Web): análise, testes, build reproduzível e DEPLOY AUTOMÁTICO no Firebase Hosting
# a cada push na main.
#
# Autenticação por Workload Identity Federation (sem chave JSON): o provedor só aceita tokens deste
# repositório na branch main, e a conta github-hosting só publica no Firebase Hosting (e lê o Cloud
# Run, exigido pelo rewrite /api). O firebase-tools usa as credenciais criadas pelo passo "auth".
name: frontend

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.9"   # mesmo valor do Dockerfile e do subir.sh
  # Configuração de produção (não são segredos).
  GCP_PROJECT_ID: caderneta01
  GCP_WIF_PROVIDER: projects/684719057324/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  GCP_SA_HOSTING: github-hosting@caderneta01.iam.gserviceaccount.com
  URL_PUBLICA: https://caderneta01.web.app

jobs:
  testes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test --concurrency=1
      - name: Build de produção
        run: flutter build web --release --no-web-resources-cdn --dart-define=MOCK_API=false
      - name: Nenhum segredo no conteúdo publicado
        run: docker run --rm -v "$PWD/build/web:/web:ro" zricethezav/gitleaks:v8.28.0 dir /web --redact --no-banner
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
          retention-days: 7

  publicar:
    # Só a main publica (push ou execução manual). Pull requests e a branch master só testam.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: testes
    runs-on: ubuntu-24.04
    concurrency:
      group: producao-frontend
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write                      # Workload Identity Federation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: build/web
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SA_HOSTING }}
      - name: Firebase Hosting (produção)
        run: npx --yes firebase-tools@15.26.0 deploy --only hosting --project "$GCP_PROJECT_ID" --non-interactive
      - name: Verificação pós-publicação
        run: |
          curl -fsS --retry 5 --retry-all-errors --retry-delay 5 -o /dev/null "$URL_PUBLICA/"
          curl -fsS -o /dev/null "$URL_PUBLICA/login"
          curl -fsS --retry 5 --retry-all-errors --retry-delay 5 "$URL_PUBLICA/api/saude"
