limit_req_zone $binary_remote_addr zone=caderneta_auth:10m rate=10r/m;
server {
    limit_req_status 429;
    error_page 429 = @limite_auth;
    location @limite_auth { default_type application/json; return 429 '{"code":"MUITAS_TENTATIVAS","message":"Muitas tentativas. Aguarde um minuto e tente novamente."}'; }
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão: o main.dart.js do Flutter é grande.
    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css image/svg+xml application/wasm;

    # DNS interno do Docker, reconsultado a cada 10 s. Com o nome em variável, o nginx não congela o IP
    # do backend na partida: se o backend reiniciar com outro IP, o proxy acompanha, e o nginx também
    # sobe antes de o backend existir.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API: mesma origem. O navegador chama /api/... e o nginx encaminha ao backend.
    # ^~ impede o fallback da SPA em /api/...; sem URI no proxy_pass, o caminho segue intacto.
    # Sem add_header de cache nem proxy_cache: respostas da API não são armazenadas.
    location = /api/auth/login {
        limit_req zone=caderneta_auth burst=10 nodelay;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/auth/registro-cliente {
        limit_req zone=caderneta_auth burst=10 nodelay;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;      # sem URI: /api/x chega como /api/x (também com variável)
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
    }

    # SPA: qualquer rota (/clientes, /vendas...) cai no index.html
    location = /api {
        return 404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # index.html sem cache para novas versões aparecerem imediatamente
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
