server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota (/clientes, /vendas...) cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html sem cache para novas versões aparecerem imediatamente
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
