limit_req_zone $binary_remote_addr zone=caderneta_auth:10m rate=10r/m;
server {
    limit_req_status 429;
    error_page 429 = @limite_auth;
    location @limite_auth { default_type application/json; return 429 '{"code":"MUITAS_TENTATIVAS","message":"Muitas tentativas. Aguarde um minuto e tente novamente."}'; }
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão: o main.dart.js do Flutter é grande.
    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css image/svg+xml application/wasm;

    # Mesmos cabeçalhos do firebase.json (produção), para o ambiente local reproduzir a produção.
    # Os arquivos do Flutter não têm hash no nome: "no-cache" força revalidação (ETag/304) e evita
    # misturar versões depois de uma publicação.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # HSTS só faz sentido em HTTPS; localmente o acesso é HTTP. Em produção vem do firebase.json.

    # DNS interno do Docker, reconsultado a cada 10 s. Com o nome em variável, o nginx não congela o IP
    # do backend na partida: se o backend reiniciar com outro IP, o proxy acompanha, e o nginx também
    # sobe antes de o backend existir.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API: mesma origem. O navegador chama /api/... e o nginx encaminha ao backend.
    # ^~ impede o fallback da SPA em /api/...; sem URI no proxy_pass, o caminho segue intacto.
    # A API define o próprio Cache-Control (no-store); aqui só o nosniff (add_header local anula os do server).
    # Limite de tentativas no login e no cadastro de cliente (10/min por IP, rajada de 10).
    location = /api/auth/login {
        limit_req zone=caderneta_auth burst=10 nodelay;
        add_header X-Content-Type-Options "nosniff" always;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/auth/registro-cliente {
        limit_req zone=caderneta_auth burst=10 nodelay;
        add_header X-Content-Type-Options "nosniff" always;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /api/ {
        add_header X-Content-Type-Options "nosniff" always;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;      # sem URI: /api/x chega como /api/x (também com variável)
        # Host e porta originais (localhost:3000). A API usa X-Forwarded-Host para saber a própria origem;
        # sem ele (e com X-Forwarded-Proto) a porta se perde, o pedido parece vir de outro site e, quando há
        # CORS configurado (perfil dev), o login é recusado com "Invalid CORS request".
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
    }

    location = /api {
        return 404;
    }

    # SPA: qualquer rota (/clientes, /vendas...) cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
